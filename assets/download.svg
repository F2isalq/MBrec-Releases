<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 76" width="360" height="76" font-family="'Segoe UI Variable Display','Segoe UI',Inter,system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FC3FF"/>
      <stop offset="1" stop-color="#1E88FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="8" y="8" width="344" height="60" rx="8"/></clipPath>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .halo { animation: halo 2.4s ease-in-out infinite; }
      .sweep { animation: sweep 3s ease-in-out infinite; }
      .arrow { animation: bob 1.2s ease-in-out infinite; }
      @keyframes halo { 50% { opacity: .8 } }
      @keyframes sweep { 0% { transform: translateX(-120px) } 60%, 100% { transform: translateX(400px) } }
      @keyframes bob { 50% { transform: translateY(4px) } }
    </style>
  </defs>
  <rect class="halo" x="14" y="14" width="332" height="50" rx="8" fill="#1E88FF" filter="url(#glow)" opacity="0.4"/>
  <rect x="8" y="8" width="344" height="60" rx="8" fill="url(#brand)"/>
  <g clip-path="url(#pill)"><rect class="sweep" x="0" y="0" width="90" height="76" fill="url(#shine)" transform="skewX(-20)"/></g>
  <g class="arrow" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 25v20M43 37l9 9 9-9"/>
  </g>
  <path d="M42 52h20" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
  <text x="80" y="36" font-size="20" font-weight="700" fill="#fff">Download for Windows</text>
  <text x="80" y="56" font-size="13" fill="#fff" fill-opacity="0.9">Latest version · 64-bit installer</text>
</svg>
